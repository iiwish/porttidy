name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o /tmp/porttidy-build-check ./cmd/porttidy

  build-darwin:
    name: build Darwin assets
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Darwin assets
        run: make build-darwin

      - name: Upload Darwin assets
        uses: actions/upload-artifact@v4
        with:
          name: porttidy-darwin
          path: dist/porttidy-darwin-*
